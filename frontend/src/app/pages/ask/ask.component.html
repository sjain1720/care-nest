<div class="page">
  <div class="page-head row">
    <div>
      <h1>{{ 'Ask CareNest' | t }}</h1>
      <p>{{ 'Answers come from your own policy, bill and settlement letter, with the page and clause.' | t }}</p>
    </div>
    <span class="spacer"></span>
    @if (chat.messages().length) {
      <button mat-button type="button" (click)="chat.clear()"><mat-icon>restart_alt</mat-icon> New chat</button>
    }
  </div>

  <app-chat-thread [prompts]="prompts" (pick)="send($event)" />
</div>
